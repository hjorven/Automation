<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Automation</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(20, 26, 34, 0.88);
        --text: #cfd8e3;
        --muted: #8796a8;
        --accent: #7fd1ff;
        --btn: #232c37;
        --btn-active: #2f4a6b;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #a9c7d8;
        color: var(--text);
        /* Safari: kein Doppel-Tipp-Zoom, kein Pull-to-Refresh, kein Scroll */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: fixed;
        background: var(--panel-bg);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        font-size: 14px;
        line-height: 1.45;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }

      #hud {
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        max-width: min(420px, calc(100vw - 24px));
        padding: 10px 14px;
        pointer-events: none;
      }
      #hud .goal b {
        color: var(--accent);
      }
      #hud .hint {
        color: var(--muted);
        margin-top: 4px;
      }
      #hud .stocks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 6px;
        color: var(--muted);
      }

      #toolbar {
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 24px);
        display: flex;
        gap: 6px;
        padding: 6px;
        overflow-x: auto;
        touch-action: pan-x;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--btn);
        border: 1px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        touch-action: manipulation;
      }
      button.active {
        background: var(--btn-active);
        border-color: var(--accent);
      }
      #toolbar button {
        flex: 0 0 auto;
        min-width: 64px;
        min-height: 56px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 12px;
      }
      #toolbar .thumb {
        width: 40px;
        height: 40px;
        margin: -4px 0 -2px;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      #panel {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: min(300px, calc(100vw - 24px));
        padding: 12px 14px;
      }
      #panel .title {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 6px;
      }
      #panel .label {
        color: var(--muted);
        margin: 6px 0;
      }
      #panel .recipes {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }
      #panel .recipes button {
        text-align: left;
        padding: 10px;
        min-height: 44px;
      }
      #panel .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      #panel .actions button {
        flex: 1;
        min-height: 44px;
      }
      #menu {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, calc(100vw - 24px));
        padding: 14px 16px;
        z-index: 10;
      }
      #menu .title {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 6px;
      }
      #menu .label {
        color: var(--muted);
        margin: 4px 0;
      }
      #menu textarea {
        box-sizing: border-box;
        width: 100%;
        height: 88px;
        margin-top: 8px;
        padding: 8px;
        font: 12px ui-monospace, monospace;
        color: var(--text);
        background: #0e1116;
        border: 1px solid #2a3442;
        border-radius: 8px;
        resize: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
        touch-action: auto;
        word-break: break-all;
      }
      #menu .msg {
        min-height: 1.45em;
        margin-top: 4px;
        color: var(--accent);
      }
      #menu .msg.error {
        color: #f88;
      }
      #menu .actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #menu .actions > * {
        flex: 1;
        min-height: 44px;
      }
      #menu .file-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--btn);
        border-radius: 10px;
        cursor: pointer;
      }
      #panel .danger,
      #menu .danger {
        background: #4a2020;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="overlay"></div>
    <div id="panel" class="overlay" hidden></div>
    <div id="toolbar" class="overlay"></div>
    <div id="menu" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
